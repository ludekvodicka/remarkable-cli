name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: rmcli
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/rmscene-ts"
          path: rmscene-ts
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/rmcommunication-ts"
          path: rmcommunication-ts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            rmscene-ts/package-lock.json
            rmcommunication-ts/package-lock.json
            rmcli/package-lock.json
      - run: npm ci
        working-directory: rmscene-ts
      - run: npm run build
        working-directory: rmscene-ts
      - run: npm ci
        working-directory: rmcommunication-ts
      - run: npm run build
        working-directory: rmcommunication-ts
      - run: npm ci
        working-directory: rmcli
      - run: npm run check
        working-directory: rmcli
      - run: npm audit --audit-level=low
        working-directory: rmcli
      - run: npm pack --dry-run
        working-directory: rmcli
